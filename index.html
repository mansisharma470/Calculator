<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
 <h1>Calculator</h1>
 <div class="calci">
    <div class="screen">
     <div class=" calc operand1"></div> 
     <div class="calc operator"></div> 
     <div class="calc operand2"> </div> 
     <div class=" dis answer "></div> 

    </div>
    

    <div class="operators">
        <div class=" operand multiply">*</div>
        <div class=" operand Addition">+</div>
        <div class=" operand Division">/</div>
        <div class=" operand Subtraction">-</div>
    </div>
    
    <div class="keypad">
        <div class="row">
            <div class="key one">1</div>
            <div class="key Two">2</div>
             <div class="key Three">3</div>
        </div>
         <div class="row">
            <div class="key four">4</div>
            <div class="key five">5</div>
             <div class="key six">6</div>
        </div>
         <div class="row">
            <div class="key seven">7</div>
            <div class="key eight">8</div>
             <div class="key nine">9</div>
        </div>
         <div class="row">
            <div class="key zero">0</div>
            <div class="key point">.</div>
             <div class=" key clear">C</div>
        </div>
        
    </div>
    <div class="submit">=</div>
 </div>
    <script src="script.js"></script>
</body>
</html>
